<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#fbfaf7">
    <meta name="description" content="Carte de visite numérique de Naoufel Mrini">

    <title>Naoufel Mrini | Libère ton potentiel</title>

    <style>
        :root {
            font-family: Arial, Helvetica, sans-serif;
            color: #20242a;
            background: #f5f4f1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .phone-card {
            position: relative;
            overflow: hidden;
            width: min(100%, 440px);
            min-height: 690px;
            background: #fffdfa;
            border-radius: 24px;
            box-shadow: 0 12px 40px #1e26331a;
            padding: 26px 22px 28px;
        }

        .phone-card:before {
            content: "";
            position: absolute;
            top: -32px;
            left: -30px;
            width: 135px;
            height: 160px;
            border: 1px solid #9bdaf1;
            transform: rotate(38deg);
            pointer-events: none;
        }

        .phone-card:after {
            content: "";
            position: absolute;
            right: -70px;
            bottom: 85px;
            width: 150px;
            height: 160px;
            background: linear-gradient(
                145deg,
                #138fc8 45%,
                #b7dfee 46%,
                #e5d8c8 75%
            );
            transform: rotate(35deg);
            opacity: .35;
            pointer-events: none;
        }

        /* LOGO ET SIGNATURE */

        .brand {
            position: relative;
            text-align: center;
            padding-top: 12px;
        }

        .brand img.signature {
            display: block;
            width: min(100%, 310px);
            height: 105px;
            object-fit: cover;
            object-position: center 22%;
            margin: 0 auto -3px;
            mix-blend-mode: multiply;
        }

        /* ORIGAMI */

        .bird {
            width: 78px;
            height: 77px;
            object-fit: cover;
            object-position: center;
            margin: 12px auto 10px;
            display: block;
            mix-blend-mode: multiply;
        }

        /* COORDONNÉES */

        .details {
            position: relative;
            z-index: 1;
            margin: 15px auto 24px;
            max-width: 345px;
        }

        .detail {
            display: flex;
            gap: 13px;
            align-items: flex-start;
            margin: 16px 0;
        }

        .icon {
            flex: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #078fc5;
            color: white;
            font-size: 17px;
        }

        .icon.tan {
            background: #b6a28d;
        }

        .value {
            padding-top: 7px;
            font-size: 13px;
            line-height: 1.42;
            font-weight: 750;
            overflow-wrap: anywhere;
        }

        .value a {
            color: inherit;
            text-decoration: none;
        }

        .value.small {
            font-size: 12px;
        }

        /* BOUTONS */

        .actions {
            position: relative;
            z-index: 1;
            display: grid;
            gap: 11px;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            border-radius: 12px;
            padding: 15px 10px;
            min-height: 53px;
        }

        .btn.primary {
            background: #078fc9;
            color: white;
        }

        .btn.secondary {
            background: #155aa9;
            color: white;
        }

        .btn.outline {
            border: 1.5px solid #087fce;
            color: #0874bd;
            background: #fff;
        }

        /* PIED DE PAGE */

        .footer {
            text-align: center;
            color: #baa18b;
            letter-spacing: .3em;
            font-size: 10px;
            font-weight: 800;
            margin-top: 20px;
        }

        .footer b {
            color: #058ec7;
        }

        /* RESPONSIVE */

        @media (min-width: 600px) {
            .phone-card {
                padding: 30px 32px;
            }
        }

        @media (max-width: 370px) {
            .phone-card {
                padding: 20px 15px;
            }

            .value {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="phone-card"
          aria-label="Carte de visite numérique de Naoufel Mrini">

        <!-- SIGNATURE ET LOGO -->

        <header class="brand">

            <img
                class="signature"
                src="signature.png"
                alt="Naoufel Mrini - Libère ton potentiel"
            >

            <img
                class="bird"
                src="origami.png"
                alt="Symbole origami"
            >

        </header>

        <!-- INFORMATIONS DE CONTACT -->

        <section class="details" aria-label="Coordonnées">

            <!-- NOM -->

            <div class="detail">
                <span class="icon" aria-hidden="true">♙</span>

                <div class="value">
                    NAOUFEL MRINI
                </div>
            </div>

            <!-- PROFESSION -->

            <div class="detail">
                <span class="icon tan" aria-hidden="true">▣</span>

                <div class="value small">
                    LEADERSHIP &amp; LEARNING SOLUTIONS
                    ARCHITECT | EXECUTIVE COACH · HARVARD ALUMNI
                </div>
            </div>

            <!-- TÉLÉPHONE -->

            <div class="detail">
                <span class="icon" aria-hidden="true">☎</span>

                <div class="value">
                    <a href="tel:+14388855194">
                        +1 438 885 5194
                    </a>
                </div>
            </div>

            <!-- EMAIL -->

            <div class="detail">
                <span class="icon tan" aria-hidden="true">✉</span>

                <div class="value">
                    <a href="mailto:naoufel.mrini@gmail.com">
                        NAOUFEL.MRINI@GMAIL.COM
                    </a>
                </div>
            </div>

            <!-- LINKEDIN -->

            <div class="detail">
                <span class="icon" aria-hidden="true">◎</span>

                <div class="value small">

                    <a
                        href="https://www.linkedin.com/in/naoufel-mrini-24a743b/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        LINKEDIN.COM/IN/NAOUFEL-MRINI-24A743B/
                    </a>

                </div>
            </div>

        </section>

        <!-- BOUTONS INTERACTIFS -->

        <nav class="actions" aria-label="Actions">

            <!-- ENREGISTRER CONTACT -->

            <a
                class="btn primary"
                href="naoufel-mrini.vcf"
                download="Naoufel-Mrini.vcf"
            >
                ♙ &nbsp; Enregistrer le contact
            </a>

            <!-- LINKEDIN -->

            <a
                class="btn secondary"
                href="https://www.linkedin.com/in/naoufel-mrini-24a743b/"
                target="_blank"
                rel="noopener noreferrer"
            >
                in &nbsp; Voir mon LinkedIn
            </a>

            <!-- EMAIL -->

            <a
                class="btn outline"
                href="mailto:naoufel.mrini@gmail.com"
            >
                ✉ &nbsp; Envoyer un email
            </a>

        </nav>

        <!-- SLOGAN EN BAS -->

        <div class="footer">
            LIBÈRE <b>TON</b> POTENTIEL
        </div>

    </main>

</body>
</html>
